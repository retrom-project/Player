name: RPG Runtime Release

on:
  workflow_dispatch:
  push:
    tags:
      - "retrom-core-ge68fff4a13a3-r*"

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF" != refs/heads/sync/upstream-ge68fff4a13a3 ]]; then
            git fetch --no-tags origin \
              '+refs/heads/retrom/ge68fff4a13a3:refs/remotes/origin/retrom/ge68fff4a13a3'
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^retrom-core-ge68fff4a13a3-r[1-9][0-9]*$ ]]
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/ge68fff4a13a3
          elif [[ "$GITHUB_REF" != refs/heads/sync/upstream-ge68fff4a13a3 ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^(feat|fix|build|sync)/[a-z0-9][a-z0-9-]*$ ]]
            git merge-base --is-ancestor origin/retrom/ge68fff4a13a3 "$GITHUB_SHA"
          fi
          test "$(python3 -c \
            'import json; print(json.load(open("retrom-fork.json"))["upstreams"][0]["ref"])')" = \
            e68fff4a13a3dd5d40678ae66ee60f85ccb04153
          baseline_commit=$(python3 -c \
            'import json; print(json.load(open("retrom-fork.json"))["upstreams"][0]["commit"])')
          test "$baseline_commit" = e68fff4a13a3dd5d40678ae66ee60f85ccb04153
          git cat-file -e \
            e68fff4a13a3dd5d40678ae66ee60f85ccb04153'^{commit}'
          git merge-base --is-ancestor \
            e68fff4a13a3dd5d40678ae66ee60f85ccb04153 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 \
            e68fff4a13a3dd5d40678ae66ee60f85ccb04153.."$GITHUB_SHA")"

      - name: Test release verifier
        run: python3 .github/rpg-runtime/test_verify_release.py

      - name: Build WebAssembly assets
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rpg-runtime-output"
          work="$RUNNER_TEMP/rpg-runtime-work"
          mkdir -p "$output" "$work"
          export RETROM_HOST_UID="$(id -u)"
          export RETROM_HOST_GID="$(id -g)"
          emsdk_digest=af45409f3199d88db4b1b03af0098532c8fb33a375ac257463eeb0a622870d06
          docker run --rm \
            --platform linux/amd64 \
            --hostname rpg-runtime-easyrpg \
            --env RETROM_HOST_UID --env RETROM_HOST_GID \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$GITHUB_WORKSPACE/.github/rpg-runtime:/recipe:ro" \
            -v "$work:/work" \
            -v "$output:/output" \
            "emscripten/emsdk@sha256:$emsdk_digest" \
            /recipe/build-easyrpg.sh

      - name: Validate and describe assets
        run: |
          set -euo pipefail
          identity_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            identity_tag=retrom-core-ge68fff4a13a3-r999999
          fi
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$identity_tag" \
            --commit "$GITHUB_SHA"

      - name: Create immutable-tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "EasyRPG Web $GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/easyrpg-player.js" \
            "$RUNNER_TEMP/rpg-runtime-output/easyrpg-player.wasm" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"

      - name: Upload branch integration candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rpg-runtime-easyrpg-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rpg-runtime-output/easyrpg-player.js
            ${{ runner.temp }}/rpg-runtime-output/easyrpg-player.wasm
            ${{ runner.temp }}/rpg-runtime-output/rpg-runtime-release.json
          if-no-files-found: error
          retention-days: 7
